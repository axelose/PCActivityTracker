name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-self-test:
    runs-on: windows-2025
    # Cold builds compile OpenSSL/SQLCipher and validate both CPU architectures.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Verify public source tree
        shell: cmd
        run: scripts\verify-public-source.cmd -RequireGit
      - name: Test staged source inspection
        shell: pwsh
        run: .\scripts\test-public-source.ps1
      - name: Validate extension JavaScript
        shell: pwsh
        run: |
          Get-ChildItem browser-extension -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.Name)" }
          }
      - name: Test browser bridge without external services
        shell: pwsh
        run: |
          node --test tests/browser/bridge.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "Browser regression tests failed." }
      - name: Cache pinned native source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache downloads only; the build verifies every archive SHA-256.
          # Never cache extracted toolchains, DLLs, logs, keys, or activity DBs.
          path: artifacts/native/downloads
          key: native-downloads-${{ runner.os }}-${{ hashFiles('.config/native-sources.json') }}
      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore PCActivityTracker.sln --locked-mode
      - name: Build and run local-only self-test
        shell: cmd
        run: scripts\self-test.cmd
      - name: Run modular core and WPF regression tests
        shell: pwsh
        run: .\scripts\test-regression.ps1
      - name: Verify native database compatibility
        shell: pwsh
        run: .\scripts\test-native-compatibility.ps1
      - name: Audit managed NuGet dependencies
        shell: pwsh
        run: dotnet list PCActivityTracker.sln package --vulnerable --include-transitive
      - name: Validate x64 and Arm64 packages and SBOMs
        shell: pwsh
        run: |
          foreach ($runtime in @('win-x64','win-arm64')) {
            .\scripts\publish.ps1 -Runtime $runtime -AllowUnsigned
          }
      - name: Verify safe release replacement
        shell: pwsh
        run: .\scripts\test-release-safety.ps1
      - name: Test release verifier rejection cases
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = $props.Project.PropertyGroup.Version
          $drop = "artifacts/release/PCActivityTracker-$version-win-x64"
          .\scripts\test-release-verifier.ps1 -PublishDirectory $drop -ArchivePath "$drop.zip"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
