name: 不具合報告
description: PC Activity Trackerの再現可能な不具合を報告します
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        URL、ページタイトル、ウィンドウタイトル、連携トークン、activity.db、未編集の画面写真は添付しないでください。セキュリティ問題は公開IssueではなくSecurity Advisoryへ報告してください。
  - type: input
    id: version
    attributes:
      label: アプリバージョン
      description: 設定画面下部に表示されるバージョンです。
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windowsバージョン
      placeholder: Windows 11 24H2 / OS build 26100.x
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 発生したこと
      description: 個人情報を架空の値へ置換して説明してください。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: 最小限の手順を記載し、実在URLや文書名は記載しないでください。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した動作
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: プライバシー確認
      options:
        - label: 履歴DB、URL、タイトル、トークン、個人情報を含めていません。
          required: true

