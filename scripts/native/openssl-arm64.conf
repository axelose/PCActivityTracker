# Project-specific Windows ARM64 target, based on OpenSSL's mingw-common
# platform and its aarch64 assembly generator. No cryptographic code changes.
my %targets = (
    "pcat-mingw-arm64" => {
        inherit_from => [ "mingw-common" ],
        CC => "aarch64-w64-mingw32-clang",
        sys_id => "MINGW64",
        bn_ops => "SIXTY_FOUR_BIT",
        asm_arch => "aarch64",
        perlasm_scheme => "win64",
        multilib => "64",
    },
);
